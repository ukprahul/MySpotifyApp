name: Build Android APK

on:
  push:
    branches: [features/myspotify]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: '-Xmx4096m -XX:MaxMetaspaceSize=512m'

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpotifyApp-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Post APK download link in summary
        run: |
          echo "## ✅ Build #${{ github.run_number }} complete" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "Triggered by commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
